<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pie Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 16px 24px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            background: #e74c3c;
            color: white;
        }
        .status.connected { background: #2ecc71; }
        .budget-bar {
            padding: 12px 24px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
        }
        .budget-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 6px;
            color: #aaa;
        }
        .budget-track {
            height: 6px;
            background: #0f3460;
            border-radius: 3px;
            overflow: hidden;
        }
        .budget-fill {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #f39c12, #e74c3c);
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
        }
        .message.user {
            align-self: flex-end;
            background: #0f3460;
        }
        .message.assistant {
            align-self: flex-start;
            background: #16213e;
            border: 1px solid #0f3460;
        }
        .input-area {
            padding: 16px 24px;
            background: #16213e;
            border-top: 1px solid #0f3460;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            background: #0f3460;
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #eee;
            font-size: 14px;
            outline: none;
        }
        .input-area input:focus { border-color: #e94560; }
        .input-area button {
            padding: 12px 24px;
            background: #e94560;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .input-area button:hover { opacity: 0.9; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
        .settings {
            display: flex;
            gap: 16px;
            padding: 8px 24px;
            background: #16213e;
            border-top: 1px solid #0f3460;
            font-size: 13px;
            color: #aaa;
        }
        .settings label { display: flex; align-items: center; gap: 6px; }
        .settings input[type="number"] {
            width: 60px;
            padding: 4px 8px;
            background: #0f3460;
            border: 1px solid #0f3460;
            border-radius: 4px;
            color: #eee;
        }
        .settings input[type="range"] { width: 100px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Pie Chat</h1>
        <span class="status" id="status">disconnected</span>
    </div>
    <div class="budget-bar">
        <div class="budget-label">
            <span>Token Budget</span>
            <span id="budget-text">0 / 128 tokens</span>
        </div>
        <div class="budget-track">
            <div class="budget-fill" id="budget-fill"></div>
        </div>
    </div>
    <div class="chat-area" id="chat"></div>
    <div class="settings">
        <label>Max tokens: <input type="number" id="max-tokens" value="128" min="1" max="2048"></label>
        <label>Temp: <input type="range" id="temp" value="0.6" min="0" max="2" step="0.1"></label>
    </div>
    <div class="input-area">
        <input type="text" id="message" placeholder="Type your message..." onkeypress="if(event.key==='Enter')send()">
        <button id="send-btn" onclick="send()">Send</button>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const chatEl = document.getElementById('chat');
        const messageEl = document.getElementById('message');
        const sendBtn = document.getElementById('send-btn');
        const budgetText = document.getElementById('budget-text');
        const budgetFill = document.getElementById('budget-fill');
        const maxTokensEl = document.getElementById('max-tokens');
        const tempEl = document.getElementById('temp');

        let ws = null;
        let currentMsgEl = null;

        function connect() {
            const wsUrl = 'ws://' + window.location.host + '/chat';
            console.log('Connecting to:', wsUrl);
            
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                console.log('WebSocket connected');
                statusEl.textContent = 'connected';
                statusEl.classList.add('connected');
            };

            ws.onmessage = function(event) {
                const msg = JSON.parse(event.data);
                console.log('Received:', msg.type);

                if (msg.type === 'start') {
                    currentMsgEl = document.createElement('div');
                    currentMsgEl.className = 'message assistant';
                    chatEl.appendChild(currentMsgEl);
                    scrollDown();
                } else if (msg.type === 'token') {
                    if (currentMsgEl) currentMsgEl.textContent += msg.text;
                    scrollDown();
                } else if (msg.type === 'done') {
                    const meta = document.createElement('div');
                    meta.style.fontSize = '11px';
                    meta.style.color = '#888';
                    meta.style.marginTop = '4px';
                    meta.textContent = msg.tokens_used + ' / ' + msg.token_budget + ' tokens (' + msg.utilization_pct.toFixed(1) + '%)' + (msg.budget_exhausted ? ' - budget exhausted' : '');
                    if (currentMsgEl) currentMsgEl.appendChild(meta);
                    updateBudget(msg.tokens_used, msg.token_budget);
                    sendBtn.disabled = false;
                    messageEl.disabled = false;
                    currentMsgEl = null;
                } else if (msg.type === 'error') {
                    addMessage('Error: ' + msg.msg, 'assistant');
                    sendBtn.disabled = false;
                    messageEl.disabled = false;
                }
            };

            ws.onclose = function() {
                console.log('WebSocket closed');
                statusEl.textContent = 'disconnected';
                statusEl.classList.remove('connected');
                setTimeout(connect, 2000);
            };

            ws.onerror = function(err) {
                console.error('WebSocket error:', err);
            };
        }

        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = text;
            chatEl.appendChild(div);
            scrollDown();
        }

        function scrollDown() {
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        function updateBudget(used, budget) {
            const pct = Math.min(100, (used / budget) * 100);
            budgetFill.style.width = pct + '%';
            budgetText.textContent = used + ' / ' + budget + ' tokens';
        }

        function send() {
            const text = messageEl.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

            addMessage(text, 'user');
            sendBtn.disabled = true;
            messageEl.disabled = true;
            messageEl.value = '';

            const maxTokens = parseInt(maxTokensEl.value);
            updateBudget(0, maxTokens);

            ws.send(JSON.stringify({
                prompt: text,
                max_tokens: maxTokens,
                temperature: parseFloat(tempEl.value)
            }));
        }

        addMessage("Hello! I am running on your local Pie inference engine with a live token budget monitor. Ask me anything.", 'assistant');
        connect();
    </script>
</body>
</html>
